services:
  nlp:
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
    build:
      context: .
      target: base
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config_api.txt:/app/config_api.txt:ro
    # Default: docker compose run --rm nlp
    #   → python run_pipeline.py  (all four core stages)
    #
    # Keyword extraction:
    #   docker compose run --rm nlp --kw
    #   docker compose run --rm nlp --kw --kw-method keybert
    #
    # Subset of stages:
    #   docker compose run --rm nlp --stages udp nt
    #
    # Dry-run (network-free):
    #   docker compose run --rm nlp --dry-run

  # -------------------------------------------------------------------------
  # LLM semantic-enrichment variant (GPU-capable; CPU fallback available).
  # Usage:
  #   docker compose --profile llm run --rm nlp-llm
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile llm run --rm nlp-llm
  # Supply HF_TOKEN in a .env file or via environment for gated models.
  # -------------------------------------------------------------------------
  nlp-llm:
    profiles: [llm]
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
    build:
      context: .
      target: llm
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./llm_config.txt:/app/llm_config.txt:ro

volumes:
  hf-cache: