# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    # Grouped into one PR. Without this these two repos opened a separate PR per
    # dependency - visible all over their merge history (#18).
    groups:
      pip-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "transformers"
        versions: [">=5.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "test"
    # Grouped into one PR. Without this these two repos opened a separate PR per
    # dependency - visible all over their merge history (#18).
    groups:
      actions:
        patterns:
          - "*"
