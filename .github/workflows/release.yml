# .github/workflows/release.yml
# Creates a GitHub Release with auto-generated notes when a v* tag is pushed.
#
# Notes-only variant: the Docker image published to GHCR via docker.yaml is
# the canonical release artefact for nlp-enrich.  service/ is a subprocess
# wrapper, not a standalone download, so no service_bundle.zip is produced here.
#
# Suggested tagging workflow:
#   git tag -a v0.16.2 -m "v0.16.2 — dep bumps + annotator folder"
#   git push origin v0.16.2
#
# After the tag push three workflows fire in sequence:
#   1. docker.yaml        — builds and pushes ghcr.io/ufal/atrium-nlp-enrich:v0.16.2
#   2. release.yml        — creates the GitHub Release (this file)
#   3. security.yml       — (scheduled/dispatch) Trivy-scans :latest after :v0.16.2 is live

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Release gate ────────────────────────────────────────────────────────────
  # A mistagged push (tag != CITATION.cff != para_config.txt [tool] version)
  # fails HERE and blocks the release job below, so nothing gets published.
  # Same check as ufal/atrium-project security.reusable.yml's version-check —
  # both now run the SAME vendored check_version.py, so the two cannot drift
  # apart the way the old inline copies did. It stays a VENDORED FILE rather
  # than a `uses:` on purpose: the guard must not depend on a cross-repo
  # `uses: …@test` resolving at tag-push time (that ordering gap is
  # what let this repo's v1.16.2 tag publish against a 0.16.2 source). Would
  # have blocked it.
  version-guard:
    name: Verify tag == CITATION.cff == para_config.txt
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Block release on version/tag mismatch
        # Was a ~45-line inline python heredoc, duplicated verbatim across all
        # five release.yml files and again (in a drifted variant) in the hub's
        # security.reusable.yml. Now one vendored script, held byte-identical to
        # docs/templates/shared/check_version.py by para-drift.reusable.yml (#18).
        # Kept as a vendored file, not a reusable workflow: this gate must not
        # depend on a cross-repo `uses:` resolving at tag-push time.
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          python check_version.py \
            --citation CITATION.cff \
            --para-config para_config.txt \
            --tag "$TAG_REF" \
            --require-tag

  release:
    name: Create GitHub Release
    needs: version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
