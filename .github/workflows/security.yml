# .github/workflows/security.yml
# Thin caller for the centralised ATRIUM security + supply-chain reusable.
#
# Job split (controlled by the reusable):
#   version-check  — runs on every PR and push; verifies CITATION.cff version
#                    matches para_config.txt [tool] version.
#   trivy-image    — runs on tag/release/schedule/dispatch only; scans
#                    ghcr.io/ufal/atrium-nlp-enrich:latest for CVEs.
#   sbom           — runs alongside trivy on the same triggers; generates
#                    a CycloneDX SBOM and attaches it to the release.
#
# No para-config-path override — nlp-enrich uses the default para_config.txt.
#
# Prerequisites (infra, not code):
#   • GHCR package ghcr.io/ufal/atrium-nlp-enrich must be published & public
#     (or auth available) before the weekly Trivy scan can pull :latest.
#     PR runs are unaffected (image-scan is gated off PRs in the reusable).

name: Security & Supply-chain

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]
  release:
    types: [published]
  schedule:
    # Weekly Monday 05:00 UTC
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a tag build - that is a publish in flight
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  security:
    permissions:
      contents: read
      packages: read
      security-events: write
      id-token: write
    uses: ufal/atrium-project/.github/workflows/security.reusable.yml@v1
    # No `secrets:` block: security.reusable.yml consumes no secrets at all
    # (Trivy/SBOM read a public GHCR image, version-check reads the tree).
    # It previously carried `secrets: inherit` for no reason (#18).
    with:
      image-ref: ghcr.io/ufal/atrium-nlp-enrich:latest
