# .github/workflows/shellcheck.yml
# Non-blocking shell-script lint (F-D3: continue-on-error rollout policy).
# Runs shellcheck on all pipeline shell scripts; results are visible in the
# Actions tab but never block a merge.
#
# -e SC1091: every stage script sources api_util/api_common.sh which
#            shellcheck cannot follow without a live filesystem — suppress
#            the "not following" error to avoid false positives.  This
#            matches the existing `# shellcheck disable=SC1091` in
#            setup_api_service.sh.

name: Shellcheck

on:
  push:
    branches: [ test, master, main ]
  pull_request:
    branches: [ test, master, main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        continue-on-error: true
        run: |
          shellcheck -e SC1091 api_*.sh api_util/*.sh setup_api_service.sh
