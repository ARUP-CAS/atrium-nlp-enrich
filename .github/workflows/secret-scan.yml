# .github/workflows/secret-scan.yml
# Scan the repository history for accidentally committed secrets via Gitleaks.
#
# Prerequisite (infra, not code):
#   The gitleaks/gitleaks-action requires a GITLEAKS_LICENSE secret for
#   organisation-owned repos (ufal).  Until the secret is added the gitleaks
#   job will error on the licence check.
#
# Alternatives if the licence is unavailable:
#   (a) Enable GitHub's native Secret Scanning + Push Protection in
#       Settings → Security → Code security and analysis.  This covers most
#       high-value credential patterns without a separate workflow.
#   (b) Swap gitleaks/gitleaks-action for the MIT gitleaks CLI in a run: step:
#         - run: |
#             curl -sSfL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_x64.tar.gz | tar -xz
#             ./gitleaks detect --source . --no-git -v
#       This avoids the licence requirement entirely.
#
# The job runs on push/PR so new secrets never land on test/master,
# plus weekly and on-demand for historical sweeps.

name: Secret Scan

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]
  schedule:
    # Weekly Monday 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks secret detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
