# .github/workflows/pre-commit.yml
# BLOCKING pre-commit run against the full file tree.
#
# Was advisory (continue-on-error) until 2026-07-30. `ruff check .` is clean on
# this repo, so the "flip to blocking after a lint-cleanup PR" note the old
# header carried is satisfied — no cleanup was needed (#18).
#
# Hooks configured in .pre-commit-config.yaml (repo root):
#   • trailing-whitespace, end-of-file-fixer, check-yaml, check-merge-conflict
#   • check-added-large-files (excludes ker_data/ to avoid flagging IDF pickles)
#   • ruff (lint + format) — reads the repo's own ruff.toml
#   • shellcheck (-e SC1091) — covers api_*.sh / api_util/*.sh / setup_api_service.sh

name: pre-commit

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: these jobs only ever read the tree

jobs:
  pre-commit:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
