# .github/workflows/codeql.yml
# CodeQL static-analysis for Python.
# Pure-Python repo: build-mode: none — no compilation step required.
# Results surface in the Security tab; findings never block CI.
# Especially relevant: nlp-enrich spawns subprocesses (service/jobs.py) and
# ships a FastAPI service/ — CodeQL will flag injection / SSRF / path-traversal
# patterns in both the shell-out layer and the HTTP surface.

name: CodeQL

on:
  push:
    branches: [test, master]
  pull_request:
    branches: [test, master]
  schedule:
    # Weekly Monday 06:00 UTC — avoids peak CI hours
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
