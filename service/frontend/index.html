<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATRIUM NLP Enrichment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.min.css">
    <style>
        body { margin-top: 2rem; max-width: 800px; margin-left: auto; margin-right: auto; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #9b4dca; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result-container { display: none; margin-top: 2rem; background: #f4f5f6; padding: 1rem; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ATRIUM NLP Document Enrichment</h2>
        <p>Upload a CSV, XLSX, or TXT file containing text lines to generate NLP-enriched TEITOK XML and keywords.</p>
        <form id="enrichForm">
            <fieldset>
                <div class="row">
                    <div class="column">
                        <label for="file">Document Upload</label>
                        <input type="file" id="file" name="file" accept=".csv,.xlsx,.txt" required>
                    </div>
                </div>
                <div class="row">
                    <div class="column column-50">
                        <label for="kw_method">Keyword Method</label>
                        <select id="kw_method" name="kw_method">
                            <option value="keybert" selected>KeyBERT (Best quality, GPU)</option>
                            <option value="yake">YAKE (Fast CPU statistical)</option>
                            <option value="legacy">Legacy (KER lemma-freq)</option>
                            <option value="none">None (Skip extraction)</option>
                        </select>
                    </div>
                    <div class="column column-25">
                        <label for="num_keywords">Keywords</label>
                        <input type="number" id="num_keywords" name="num_keywords" value="20" min="1" max="100">
                    </div>
                    <div class="column">
                        <label for="format">Output Format</label>
                        <select id="format" name="format">
                            <option value="json" selected>JSON Envelope</option>
                            <option value="zip">ZIP Workspace</option>
                        </select>
                    </div>
                </div>

                <input class="button-primary" type="submit" value="Run Enrichment" id="submitBtn">
                <div class="loader" id="loader"></div>
            </fieldset>
        </form>
        <pre id="result-container"><code id="result"></code></pre>
    </div>
    <script src="script.js"></script>
</body>
</html>
