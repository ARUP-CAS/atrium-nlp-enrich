# Standalone Label Studio deployment for the ATRIUM archaeo NER annotation campaign.
#
# This setup runs Label Studio on host port 8001 to avoid clashing with
# pipeline services on 8000.
#
#   Configure:  cp .env.example .env   # then edit the admin password
#   Start:      docker compose up -d   ->  http://localhost:8001
#   Stop:       docker compose down    # data persists in the label-studio-data volume
#   Reset:      docker compose down -v # deletes all projects/annotations
services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: atrium-label-studio
    ports:
      - "8001:8080"
    environment:
      LABEL_STUDIO_USERNAME: "${LS_ADMIN_USERNAME:-admin@example.com}"
      LABEL_STUDIO_PASSWORD: "${LS_ADMIN_PASSWORD:-changeme}"
    volumes:
      - label-studio-data:/label-studio/data
    restart: unless-stopped

volumes:
  label-studio-data: